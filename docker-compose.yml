# Intelligent Capital Call & Liquidity Orchestration — Camunda 8 edition
# Camunda 8.10 (latest stable) self-managed, lightweight distribution + Java services.
name: camunda-assetmgmt

x-app-env: &app-env
  CAMUNDA_REST_ADDRESS: http://orchestration:8080
  CAMUNDA_PUBLIC_URL: http://localhost:8080
  PORTAL_PUBLIC_URL: http://localhost:8090
  DATABASE_URL: postgres://assetmgmt:assetmgmt@postgres:5432/assetmgmt?sslmode=disable
  REPORT_DIR: /reports

services:
  # ─── Camunda 8 ────────────────────────────────────────────────────────
  camunda-data-init:
    image: camunda/camunda:${CAMUNDA_VERSION:-8.10.9}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 1001:1001 /usr/local/camunda/camunda-data && chmod 775 /usr/local/camunda/camunda-data"]
    volumes:
      - camunda-data:/usr/local/camunda/camunda-data
    restart: "no"

  orchestration: # Zeebe engine + Operate + Tasklist + Orchestration Cluster REST API
    image: camunda/camunda:${CAMUNDA_VERSION:-8.10.9}
    container_name: camunda-orchestration
    ports:
      - "8080:8080"   # Web UIs (Operate, Tasklist, Admin) + REST API /v2
      - "26500:26500" # gRPC gateway
      - "9600:9600"   # management / health
    environment:
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1g"
    mem_limit: 2g
    volumes:
      - camunda:/usr/local/camunda/data
      - camunda-data:/usr/local/camunda/camunda-data
      - ./camunda/application.yaml:/usr/local/camunda/config/application.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n\" >&3 && head -n 1 <&3 | grep -q 200'"]
      interval: 5s
      retries: 40
      start_period: 30s
    restart: on-failure
    depends_on:
      camunda-data-init:
        condition: service_completed_successfully

  # ─── Business systems / mocks ─────────────────────────────────────────
  postgres: # fund admin system + double-entry ledger
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: assetmgmt
      POSTGRES_PASSWORD: assetmgmt
      POSTGRES_DB: assetmgmt
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetmgmt"]
      interval: 3s
      retries: 20

  mock-ses: # e-mail / Slack log viewer
    build: { context: ., args: { SERVICE: mockses } }
    ports: ["8081:8081"]

  mock-credit-facility: # bridge / subscription line HTTP stub
    build: { context: ., args: { SERVICE: mockcreditfacility } }
    ports: ["8082:8082"]

  ml-scorer: # Flask default-risk model
    build: { context: ./services/ml-scorer }
    ports: ["5001:5001"]

  # ─── Application (Java) ───────────────────────────────────────────────
  worker: # Camunda job workers + BPMN deployment
    build: { context: ., args: { SERVICE: worker } }
    environment:
      <<: *app-env
      SES_URL: http://mock-ses:8081
      ML_SCORER_URL: http://ml-scorer:5001
      CREDIT_FACILITY_URL: http://mock-credit-facility:8082
      BPMN_DIR: /app/bpmn
    volumes:
      - ./reports:/reports
    depends_on:
      orchestration: { condition: service_healthy }
      postgres: { condition: service_healthy }
      mock-ses: { condition: service_started }
      ml-scorer: { condition: service_started }
      mock-credit-facility: { condition: service_started }
    restart: on-failure

  api-server: # REST/webhook endpoints + live dashboard
    build: { context: ., args: { SERVICE: apiserver } }
    environment:
      <<: *app-env
      LISTEN_ADDR: ":8090"
      SES_PUBLIC_URL: http://localhost:8081
    ports: ["8090:8090"]
    volumes:
      - ./reports:/reports
    depends_on:
      orchestration: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: on-failure

  demo-driver: # optional: docker compose --profile demo run --rm demo-driver
    build: { context: ., args: { SERVICE: demodriver } }
    profiles: ["demo"]
    environment:
      API_URL: http://api-server:8090
    depends_on:
      api-server: { condition: service_started }

volumes:
  camunda:
  camunda-data:
  postgres-data:
