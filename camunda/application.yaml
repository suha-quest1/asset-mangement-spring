# Camunda 8.10 lightweight orchestration cluster (Zeebe + Operate + Tasklist +
# REST API in one container) using embedded H2 as secondary storage.
# Based on camunda-distributions/docker-compose/versions/camunda-8.10/configuration/application-h2.yaml
management.endpoints.configprops.show-values: always
camunda:
  system:
    cpu-thread-count: "3"
    io-thread-count: "3"
  security:
    authentication:
      method: "basic"
      # REST/gRPC API open for the local demo; web UIs still require login (demo/demo)
      unprotectedApi: true
    authorizations:
      enabled: false
    initialization:
      users:
        - username: "demo"
          password: "demo"
          name: "Demo User"
          email: "demo@demo.com"
      defaultRoles.admin.users:
        - "demo"
  data:
    secondary-storage:
      type: rdbms
      rdbms:
        url: jdbc:h2:file:./camunda-data/h2db
        username: sa
        password:
        flushInterval: PT0.5S
        queueSize: 1000
